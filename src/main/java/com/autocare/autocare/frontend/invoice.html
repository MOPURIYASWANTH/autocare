<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice - AutoCare</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

```
<!-- Navbar -->
<nav class="navbar">

    <div class="brand">
        🚗 AutoCare
    </div>

    <button
        class="logout-btn"
        onclick="logout()">
        Logout
    </button>

</nav>

<!-- Section Navigation -->
<div class="section-nav">

    <button onclick="window.location.href='dashboard.html'">
        🏠 Dashboard
    </button>

    <button onclick="window.location.href='vehicles.html'">
        🚗 My Vehicles
    </button>

    <button onclick="window.location.href='services.html'">
        🔧 Services
    </button>

    <button onclick="window.location.href='booking.html'">
        📅 Book Service
    </button>

    <button onclick="window.location.href='bookings.html'">
        📋 My Bookings
    </button>

</div>

<!-- Invoice -->
<div class="invoice-container">

    <div class="page-header">

        <div>

            <h1>
                Service Invoice
            </h1>

            <p class="page-subtitle">
                Your vehicle service invoice
            </p>

        </div>

    </div>

    <div
        id="invoiceDetails"
        class="invoice-card">

        <p class="loading-message">
            Loading invoice...
        </p>

    </div>

    <!-- Invoice Actions -->
    <div class="invoice-actions">

        <button
            class="secondary-btn"
            onclick="window.location.href='bookings.html'">

            ← Back to Bookings

        </button>

        <button
            class="login-btn print-btn"
            onclick="window.print()">

            🖨 Print Invoice

        </button>

    </div>

</div>

<script src="app.js"></script>
```

</body>

</html>
