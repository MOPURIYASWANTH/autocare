<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AutoCare - Register</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

	<div class="login-container">

		<div class="login-box">

			<div class="logo">🚗</div>

			<h1>Create Account</h1>

			<p class="subtitle">Join AutoCare today</p>


			<form id="registerForm">

				<div class="form-group">

					<label>Full Name</label> <input type="text" id="name"
						placeholder="Enter your name" required>

				</div>


				<div class="form-group">

					<label>Email Address</label> <input type="email" id="registerEmail"
						placeholder="Enter your email" required>

				</div>


				<div class="form-group">

					<label>Phone Number</label> <input type="tel" id="phone"
						placeholder="Enter your phone number" required>

				</div>


				<div class="form-group">

					<label>Password</label> <input type="password"
						id="registerPassword" placeholder="Create a password" required>

				</div>


				<button type="submit" class="login-btn">Create Account</button>

			</form>


			<p id="registerMessage"></p>


			<p class="register-text">

				Already have an account? <a href="login.html"> Login </a>

			</p>

		</div>

	</div>


	<script src="app.js"></script>

</body>

</html>
