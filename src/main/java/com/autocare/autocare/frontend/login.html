<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AutoCare - Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <div class="logo">
                🚗
            </div>

            <h1>AutoCare</h1>

            <p class="subtitle">
                Smart Vehicle Service Management
            </p>

            <form id="loginForm">

                <div class="form-group">

                    <label>Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-btn">

                    Login

                </button>

            </form>


            <p id="loginMessage"></p>


            <p class="register-text">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </p>

        </div>

    </div>


    <script src="app.js"></script>

</body>

</html>
